<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡实验室 | Each Static Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;900&display=swap');

        :root {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --accent-blue: #0071e3;
        }

        .dark-mode {
            --bg-color: #000000;
            --text-color: #f5f5f7;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.5s ease;
        }

        /* 1. 增强的日历格子 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .calendar-day {
            aspect-ratio: 1;
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
        }

        .dark-mode .calendar-day {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.03);
        }

        /* 今日特别标注 */
        .calendar-day.today {
            border: 2px solid var(--accent-blue);
            background: rgba(0, 113, 227, 0.05);
            box-shadow: 0 0 15px rgba(0, 113, 227, 0.2);
        }

        .calendar-day.today::before {
            content: "TODAY";
            font-size: 7px;
            font-weight: 900;
            color: var(--accent-blue);
            position: absolute;
            top: 6px;
            letter-spacing: 1px;
        }

        .calendar-day:hover {
            transform: scale(1.05);
            background: white;
            border-color: var(--accent-blue);
            z-index: 10;
        }

        .dark-mode .calendar-day:hover {
            background: #1c1c1e;
        }

        .dot-container {
            display: flex;
            gap: 3px;
            position: absolute;
            bottom: 8px;
        }

        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #10b981;
        }

        /* 2. 英雄动画弹窗 */
        #hero-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #hero-modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 90%;
            max-width: 420px;
            background: var(--bg-color);
            padding: 2.5rem;
            border-radius: 3rem;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.2);
            /* 动画核心：初始状态 */
            transform-origin: center;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 3. 三态复选框美化 */
        .status-box {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .dark-mode .status-box {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .status-none {
            background: transparent;
        }

        .status-done {
            background: #10b981;
            border-color: #10b981 !important;
            color: white;
        }

        .status-fail {
            background: #ef4444;
            border-color: #ef4444 !important;
            color: white;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }

        .dark-mode .task-item {
            background: rgba(255, 255, 255, 0.03);
        }

        .task-chip {
            background: #0071e3;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            margin: 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 113, 227, 0.2);
        }

        #success-toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 14px 28px;
            border-radius: 20px;
            z-index: 3000;
            transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        #success-toast.active {
            bottom: 40px;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--text-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.03;
            z-index: -1;
        }
    </style>
</head>

<body class="antialiased">
    <div class="grid-bg"></div>
    <script src="../components/navbar.js"></script>

    <div id="g_id_onload" data-client_id="609809453790-kdjpgmqh15b6bbom07tkhd4ih8lnug3b.apps.googleusercontent.com"
        data-callback="handleSignIn" data-auto_select="true" data-itp_support="true">
    </div>

    <main class="max-w-4xl mx-auto px-8 pt-32 pb-20">
        <header class="mb-12 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <div class="flex items-center gap-4 mb-2">
                    <h1 class="text-4xl font-black tracking-tight" style="font-family: 'Noto Sans SC'">打卡实验室</h1>
                    <select id="user-selector" onchange="switchUserView()"
                        class="bg-blue-600/10 text-blue-600 text-[10px] font-black px-4 py-1.5 rounded-full border-none outline-none cursor-pointer uppercase tracking-widest">
                    </select>
                </div>
                <p class="text-gray-400 font-mono text-[10px] tracking-[0.2em]">CLOUD NODE: VERCEL-KV // DATA SYNCING
                </p>
            </div>
            <div id="current-month" class="text-2xl font-black text-blue-600 font-mono italic">2025.12</div>
        </header>

        <div class="calendar-grid" id="calendar"></div>

        <div id="input-zone"
            class="mt-12 p-10 rounded-[3.5rem] bg-white/40 dark:bg-zinc-900/40 backdrop-blur border border-black/5 dark:border-white/5 opacity-50 pointer-events-none transition-all">
            <h3 id="input-header" class="font-bold mb-6 flex items-center gap-3">
                <i class="fas fa-fingerprint text-blue-500"></i> 等待身份验证...
            </h3>

            <div id="task-preview-area" class="flex flex-wrap mb-6"></div>

            <textarea id="task-input" rows="1"
                class="w-full bg-transparent border-none p-0 text-xl font-medium focus:ring-0 placeholder-gray-300 dark:placeholder-gray-700 resize-none overflow-hidden"
                placeholder="键入今日文稿条目, Enter 分离..."></textarea>

            <div class="mt-10 flex justify-between items-center">
                <div class="flex items-center gap-2 text-[10px] text-gray-400 font-mono">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> SYSTEM READY
                </div>
                <button onclick="doCheckIn()"
                    class="px-10 py-4 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-black rounded-2xl font-black text-xs uppercase tracking-widest hover:scale-105 active:scale-95 transition shadow-2xl">
                    上传云端存储
                </button>
            </div>
        </div>
    </main>

    <div id="name-modal" class="hidden">
        <div class="bg-white dark:bg-zinc-900 p-12 rounded-[3.5rem] text-center max-w-sm">
            <h2 class="text-2xl font-black mb-6">新身份识别</h2>
            <input id="nickname-input" type="text"
                class="w-full bg-zinc-100 dark:bg-zinc-800 p-5 rounded-2xl mb-8 outline-none border-2 border-transparent focus:border-blue-500 text-center font-bold"
                placeholder="输入实验室代号">
            <button onclick="confirmNickname()"
                class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black">建立连接</button>
        </div>
    </div>

    <div id="hero-modal" onclick="closeHero()">
        <div id="modal-content" class="modal-content" onclick="event.stopPropagation()">
            <div id="modal-date"
                class="text-[10px] font-mono text-blue-600 tracking-widest uppercase mb-4 opacity-50 text-center"></div>
            <div id="modal-text-content" class="space-y-3 mb-10"></div>
            <div id="edit-zone" class="hidden mb-4">
                <button id="edit-trigger-btn"
                    class="w-full py-4 bg-blue-600/10 text-blue-600 rounded-2xl text-xs font-black uppercase tracking-widest hover:bg-blue-600 hover:text-white transition">编辑文稿</button>
            </div>
            <button onclick="closeHero()"
                class="w-full py-4 bg-zinc-100 dark:bg-zinc-800 rounded-2xl text-[10px] font-black uppercase tracking-widest opacity-40">返回核心视图</button>
        </div>
    </div>

    <div id="success-toast">
        <span class="text-xs font-black uppercase tracking-widest"><i class="fas fa-check-circle mr-2"></i> 同步成功 /
            数据已持久化</span>
    </div>

    <script>
        const calendarEl = document.getElementById('calendar');
        const userSelector = document.getElementById('user-selector');
        const taskInput = document.getElementById('task-input');
        const previewArea = document.getElementById('task-preview-area');

        let now = new Date();
        let year = now.getFullYear();
        let month = now.getMonth();
        let currentTasks = []; // 存储结构变为对象: { text: "xxx", status: 0/1/2 }
        let loginUser = null;
        let googleSub = null;
        let cloudData = {};
        let editingDate = null;

        // 1. 登录逻辑
        function handleSignIn(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            googleSub = payload.sub;
            localStorage.setItem('is_logged_in', 'true');
            const savedName = localStorage.getItem(`nickname_${googleSub}`);
            if (savedName) initUserSession(savedName);
            else document.getElementById('name-modal').classList.add('active');
        }

        window.onload = () => loadCheckInData();

        function confirmNickname() {
            const val = document.getElementById('nickname-input').value.trim();
            if (val) {
                localStorage.setItem(`nickname_${googleSub}`, val);
                initUserSession(val);
                document.getElementById('name-modal').classList.remove('active');
            }
        }

        function initUserSession(name) {
            loginUser = name;
            document.getElementById('input-zone').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('input-header').innerHTML = `<i class="fas fa-unlock text-blue-500 mr-2"></i> 授权成功: ${name}`;
            loadCheckInData();
        }

        // 2. 输入逻辑优化：支持状态存储
        taskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = taskInput.value.trim();
                if (val) {
                    currentTasks.push({ text: val, status: 0 });
                    taskInput.value = '';
                    renderChips();
                }
            }
        });

        function renderChips() {
            previewArea.innerHTML = currentTasks.map((task, i) => `
                <div class="task-chip">
                    <span onclick="toggleTaskStatus(${i})" class="cursor-pointer">
                        ${getStatusIcon(task.status)}
                    </span>
                    <span>${task.text}</span>
                    <i class="fas fa-times opacity-30 cursor-pointer ml-1" onclick="removeChip(${i})"></i>
                </div>
            `).join('');
        }

        function getStatusIcon(status) {
            if (status === 1) return '<i class="fas fa-check-circle text-green-300"></i>';
            if (status === 2) return '<i class="fas fa-times-circle text-red-300"></i>';
            return '<i class="far fa-circle opacity-50"></i>';
        }

        function toggleTaskStatus(i) {
            currentTasks[i].status = (currentTasks[i].status + 1) % 3;
            renderChips();
        }

        function removeChip(i) { currentTasks.splice(i, 1); renderChips(); }

        // 3. 云端数据与日历渲染
        async function loadCheckInData() {
            try {
                const res = await fetch('/api/checkin');
                cloudData = await res.json();
                const users = Object.keys(cloudData);
                const currentSelected = userSelector.value;
                userSelector.innerHTML = users.map(u => `<option value="${u}" ${u === (currentSelected || loginUser) ? 'selected' : ''}>${u}</option>`).join('');
                renderCalendar(userSelector.value || loginUser || users[0]);
            } catch (e) { console.error(e); }
        }

        function renderCalendar(targetUser) {
            calendarEl.innerHTML = '';
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const userData = cloudData[targetUser] || {};
            const todayDate = now.getDate();

            for (let i = 1; i <= daysInMonth; i++) {
                const dateKey = `${year}-${month + 1}-${i}`;
                const rawData = userData[dateKey]; // 可能是旧字符串，也可能是新JSON字符串

                const day = document.createElement('div');
                day.className = `calendar-day ${i === todayDate && (month === now.getMonth()) ? 'today' : ''}`;
                day.innerHTML = `<span class="font-mono text-xs font-black opacity-20">${i}</span>`;

                if (rawData) {
                    day.innerHTML += `<div class="dot-container"><div class="dot"></div></div>`;
                    day.onclick = (e) => openHero(e, dateKey, targetUser, rawData);
                }
                calendarEl.appendChild(day);
            }
        }

        // 4. 英雄动画弹窗核心
        function openHero(event, date, user, rawData) {
            editingDate = date;
            const modal = document.getElementById('hero-modal');
            const content = document.getElementById('modal-content');

            // 计算线性移动起始点
            const rect = event.currentTarget.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            // 设置初始位置为点击的格子位置并缩小
            content.style.transition = 'none';
            content.style.transform = `translate(${startX - window.innerWidth / 2}px, ${startY - window.innerHeight / 2}px) scale(0.1)`;

            modal.classList.add('active');

            // 触发重绘后开启动画
            setTimeout(() => {
                content.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                content.style.transform = `translate(0, 0) scale(1)`;
            }, 10);

            // 解析内容并显示三态展示
            document.getElementById('modal-date').innerText = `${date} // ${user}`;
            let items = [];
            try {
                // 尝试解析 JSON (新格式)，如果失败则按行分割 (旧格式)
                items = JSON.parse(rawData);
            } catch (e) {
                items = rawData.split('\n').map(t => ({ text: t, status: 1 }));
            }

            document.getElementById('modal-text-content').innerHTML = items.map((item, idx) => `
                <div class="task-item">
                    <div class="status-box ${getStatusClass(item.status)}" onclick="updateCloudStatus(${idx})">
                        ${getStatusContent(item.status)}
                    </div>
                    <span class="text-sm font-medium opacity-80">${item.text}</span>
                </div>
            `).join('');

            const editZone = document.getElementById('edit-zone');
            if (user === loginUser) {
                editZone.classList.remove('hidden');
                document.getElementById('edit-trigger-btn').onclick = () => {
                    currentTasks = [...items];
                    renderChips();
                    closeHero();
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                };
            } else editZone.classList.add('hidden');
        }

        function getStatusClass(s) { return s === 1 ? 'status-done' : (s === 2 ? 'status-fail' : 'status-none'); }
        function getStatusContent(s) { return s === 1 ? '<i class="fas fa-check"></i>' : (s === 2 ? '<i class="fas fa-times"></i>' : ''); }

        function closeHero() {
            const modal = document.getElementById('hero-modal');
            modal.classList.remove('active');
        }

        // 5. 打卡同步
        async function doCheckIn() {
            if (!loginUser || currentTasks.length === 0) return;
            const dateKey = editingDate || `${year}-${month + 1}-${now.getDate()}`;

            const res = await fetch('/api/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user: loginUser,
                    date: dateKey,
                    text: JSON.stringify(currentTasks) // 以 JSON 字符串存储对象数组
                })
            });

            if (res.ok) {
                const toast = document.getElementById('success-toast');
                toast.classList.add('active');
                currentTasks = [];
                editingDate = null;
                renderChips();
                await loadCheckInData();
                setTimeout(() => toast.classList.remove('active'), 3000);
            }
        }

        function switchUserView() { renderCalendar(userSelector.value); }
    </script>
</body>

</html>
