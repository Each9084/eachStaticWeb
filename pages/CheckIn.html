<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡实验室 | Each Static Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Noto+Sans+SC:wght@400;900&display=swap');

        :root {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --accent-blue: #0071e3;
        }

        .dark-mode {
            --bg-color: #000000;
            --text-color: #f5f5f7;
        }

        body {
            font-family: -apple-system, "SF Pro SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.5s ease;
        }

        /* 哥特字体 Logo 修复 */
        .gothic-logo {
            font-family: 'UnifrakturMaguntia', serif !important;
            font-size: 1.5rem;
        }

        /* 增强的日历格子 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .calendar-day {
            aspect-ratio: 1;
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .dark-mode .calendar-day {
            background: rgba(255, 255, 255, 0.03);
        }

        /* 麦穗背景奖励 */
        .wreath-bg {
            position: absolute;
            inset: 0;
            background: url('../assets/wheatEarRing.svg') no-repeat center;
            background-size: 85%;
            opacity: 0.15;
            pointer-events: none;
        }

        .calendar-day.today {
            border: 2px solid var(--accent-blue);
        }

        .calendar-day.today::before {
            content: "TODAY";
            font-size: 7px;
            font-weight: 900;
            color: var(--accent-blue);
            position: absolute;
            top: 6px;
            letter-spacing: 1px;
        }

        /* 英雄动画弹窗 */
        #hero-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #hero-modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 90%;
            max-width: 440px;
            background: var(--bg-color);
            padding: 2.5rem;
            border-radius: 3rem;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.2);
            transform-origin: center;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 冲突警告条幅 */
        #conflict-banner {
            height: 0;
            overflow: hidden;
            background: #ef4444;
            color: white;
            text-align: center;
            font-size: 10px;
            font-weight: 900;
            border-radius: 1rem 1rem 0 0;
            transition: height 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        #conflict-banner.active {
            height: 30px;
            line-height: 30px;
        }

        /* 三态状态框 */
        .status-box {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .status-done {
            background: #10b981;
            border-color: #10b981 !important;
            color: white;
        }

        .status-fail {
            background: #ef4444;
            border-color: #ef4444 !important;
            color: white;
        }

        .task-chip {
            background: #0071e3;
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            margin: 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 113, 227, 0.2);
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--text-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.03;
            z-index: -1;
        }
    </style>
</head>

<body class="antialiased">
    <div class="grid-bg"></div>

    <nav class="fixed top-0 w-full z-50 backdrop-blur-xl border-b border-black/5 dark:border-white/5">
        <div class="max-w-6xl mx-auto px-8 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center group">
                <span class="gothic-logo text-[#1d1d1f] dark:text-white font-semibold">
                    <span class="text-[#0071e3]">Each</span> Web
                </span>
            </a>
            <div class="flex items-center gap-6">
                <div id="g_id_onload"
                    data-client_id="609809453790-kdjpgmqh15b6bbom07tkhd4ih8lnug3b.apps.googleusercontent.com"
                    data-callback="handleSignIn" data-auto_select="true"></div>
                <div class="g_id_signin" data-type="icon" data-shape="circle"></div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-8 pt-32 pb-20">
        <header class="mb-12 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <div class="flex items-center gap-4 mb-2">
                    <h1 class="text-4xl font-black tracking-tight" style="font-family: 'Noto Sans SC'">打卡实验室</h1>
                    <select id="user-selector" onchange="switchUserView()"
                        class="bg-blue-600/10 text-blue-600 text-[10px] font-black px-4 py-1.5 rounded-full outline-none cursor-pointer uppercase">
                    </select>
                </div>
                <p class="text-gray-400 font-mono text-[10px] tracking-[0.2em]">CLOUD NODE: VERCEL-KV // DATA SYNCING
                </p>
            </div>

            <div class="flex items-center gap-4">
                <input type="month" id="month-picker" onchange="changeMonth()"
                    class="bg-blue-600/5 text-blue-600 font-mono font-black px-4 py-2 rounded-xl border-none outline-none cursor-pointer">
            </div>
        </header>

        <div class="calendar-grid" id="calendar"></div>

        <div class="relative mt-12">
            <div id="conflict-banner">⚠️ 该日期已有内容，建议直接点击上方卡片进入编辑模式</div>
            <div id="input-zone"
                class="p-10 rounded-b-[3.5rem] bg-white/40 dark:bg-zinc-900/40 backdrop-blur border border-black/5 dark:border-white/5 opacity-50 pointer-events-none transition-all">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="input-header" class="font-bold flex items-center gap-3"><i
                            class="fas fa-fingerprint text-blue-500"></i> 等待身份验证...</h3>
                    <span id="editing-date-display"
                        class="bg-blue-600 text-white text-[10px] px-3 py-1 rounded-md font-mono font-bold tracking-tighter">TARGET:
                        ----</span>
                </div>

                <div id="task-preview-area" class="flex flex-wrap mb-6"></div>
                <textarea id="task-input" rows="1"
                    class="w-full bg-transparent border-none p-0 text-xl font-medium focus:ring-0 placeholder-gray-300 dark:placeholder-gray-700 resize-none overflow-hidden"
                    placeholder="键入今日文稿条目, Enter 分离..."></textarea>

                <div class="mt-10 flex justify-between items-center">
                    <div class="flex items-center gap-2 text-[10px] text-gray-400 font-mono"><span
                            class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> SYSTEM READY</div>
                    <button onclick="doCheckIn()"
                        class="px-10 py-4 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-black rounded-2xl font-black text-xs uppercase tracking-widest hover:scale-105 active:scale-95 transition shadow-2xl">同步至云端</button>
                </div>
            </div>
        </div>
    </main>

    <div id="hero-modal" onclick="closeHero()">
        <div id="modal-content" class="modal-content" onclick="event.stopPropagation()">
            <div id="modal-date"
                class="text-[10px] font-mono text-blue-600 tracking-widest uppercase mb-4 opacity-50 text-center"></div>
            <div id="modal-text-content" class="space-y-3 mb-10"></div>
            <div id="edit-zone" class="hidden mb-4">
                <button id="edit-trigger-btn"
                    class="w-full py-4 bg-blue-600/10 text-blue-600 rounded-2xl text-xs font-black uppercase tracking-widest hover:bg-blue-600 hover:text-white transition">进入编辑模式</button>
            </div>
            <button onclick="closeHero()"
                class="w-full py-4 bg-zinc-100 dark:bg-zinc-800 rounded-2xl text-[10px] font-black uppercase tracking-widest opacity-40">关闭</button>
        </div>
    </div>

    <div id="name-modal"
        class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/20 backdrop-blur-md">
        <div class="bg-white dark:bg-zinc-900 p-12 rounded-[3.5rem] text-center max-w-sm">
            <h2 class="text-2xl font-black mb-6">新身份识别</h2>
            <input id="nickname-input" type="text"
                class="w-full bg-zinc-100 dark:bg-zinc-800 p-5 rounded-2xl mb-8 outline-none border-2 border-transparent focus:border-blue-500 text-center font-bold"
                placeholder="输入实验室代号">
            <button onclick="confirmNickname()"
                class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black">建立连接</button>
        </div>
    </div>

    <div id="success-toast"
        class="fixed bottom-[-100px] left-1/2 -translate-x-1/2 bg-green-500 text-white px-8 py-4 rounded-full transition-all duration-500 font-bold z-50">
        数据已持久化</div>

    <script>
        const calendarEl = document.getElementById('calendar');
        const userSelector = document.getElementById('user-selector');
        const taskInput = document.getElementById('task-input');
        const monthPicker = document.getElementById('month-picker');
        const conflictBanner = document.getElementById('conflict-banner');

        let now = new Date();
        let currentYear = now.getFullYear();
        let currentMonth = now.getMonth();
        let currentTasks = [];
        let loginUser = null;
        let googleSub = null;
        let cloudData = {};
        let editingDate = `${currentYear}-${currentMonth + 1}-${now.getDate()}`;

        window.onload = () => {
            monthPicker.value = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            loadCheckInData();
        };

        async function loadCheckInData() {
            try {
                const res = await fetch('/api/checkin');
                cloudData = await res.json();
                updateUserList();
                renderCalendar();
            } catch (e) { console.error(e); }
        }

        // 动态显示当月所有天数
        function renderCalendar() {
            calendarEl.innerHTML = '';
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const targetUser = userSelector.value || loginUser;
            const userData = cloudData[targetUser] || {};

            for (let i = 1; i <= daysInMonth; i++) {
                const dateKey = `${currentYear}-${currentMonth + 1}-${i}`;
                const rawData = userData[dateKey];
                const day = document.createElement('div');
                const isToday = i === now.getDate() && currentMonth === now.getMonth() && currentYear === now.getFullYear();

                day.className = `calendar-day ${isToday ? 'today' : ''}`;
                day.innerHTML = `<span class="font-mono text-xs font-black opacity-20 z-10">${i}</span>`;

                if (rawData) {
                    const items = JSON.parse(rawData);
                    const allDone = items.length > 0 && items.every(it => it.status === 1);
                    const anyDone = items.some(it => it.status === 1);
                    const allFail = items.every(it => it.status === 2);

                    if (allDone) day.innerHTML += `<div class="wreath-bg"></div>`;

                    const dot = document.createElement('div');
                    dot.className = 'w-1.5 h-1.5 rounded-full mt-2';
                    dot.style.background = allDone ? '#10b981' : (allFail ? '#ef4444' : (anyDone ? '#f59e0b' : '#10b981'));
                    day.appendChild(dot);

                    day.onclick = (e) => openHero(e, dateKey, targetUser, rawData);
                } else {
                    day.onclick = () => {
                        editingDate = dateKey;
                        document.getElementById('editing-date-display').innerText = `TARGET: ${dateKey}`;
                        checkConflict();
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    };
                }
                calendarEl.appendChild(day);
            }
        }

        function changeMonth() {
            const val = monthPicker.value.split('-');
            currentYear = parseInt(val[0]);
            currentMonth = parseInt(val[1]) - 1;
            renderCalendar();
        }

        function openHero(event, date, user, rawData) {
            editingDate = date;
            const modal = document.getElementById('hero-modal');
            const content = document.getElementById('modal-content');
            const rect = event.currentTarget.getBoundingClientRect();

            content.style.transition = 'none';
            content.style.transform = `translate(${rect.left - window.innerWidth / 2 + rect.width / 2}px, ${rect.top - window.innerHeight / 2 + rect.height / 2}px) scale(0.1)`;
            modal.classList.add('active');

            setTimeout(() => {
                content.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                content.style.transform = `translate(0, 0) scale(1)`;
            }, 10);

            document.getElementById('modal-date').innerText = `${date} // ${user}`;
            const tasks = JSON.parse(rawData);

            const drawList = () => {
                document.getElementById('modal-text-content').innerHTML = tasks.map((t, idx) => `
                    <div class="flex items-center gap-4 p-3 bg-black/5 rounded-xl">
                        <div class="status-box ${t.status === 1 ? 'status-done' : (t.status === 2 ? 'status-fail' : '')}" 
                             onclick="cycleStatus(${idx})">
                            ${t.status === 1 ? '✓' : (t.status === 2 ? '×' : '')}
                        </div>
                        <span class="text-sm font-bold">${t.text}</span>
                    </div>
                `).join('');
            };

            window.cycleStatus = (idx) => {
                if (user !== loginUser) return;
                tasks[idx].status = (tasks[idx].status + 1) % 3;
                drawList();
                fetch('/api/checkin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: loginUser, date: date, text: JSON.stringify(tasks) })
                }).then(() => loadCheckInData());
            };

            drawList();
            const ez = document.getElementById('edit-zone');
            ez.className = user === loginUser ? 'block mb-4' : 'hidden';
            document.getElementById('edit-trigger-btn').onclick = () => {
                currentTasks = [...tasks];
                document.getElementById('editing-date-display').innerText = `TARGET: ${date}`;
                renderChips();
                closeHero();
                checkConflict();
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };
        }

        function handleSignIn(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            googleSub = payload.sub;
            const savedName = localStorage.getItem(`nickname_${googleSub}`);
            if (savedName) initUserSession(savedName);
            else document.getElementById('name-modal').classList.remove('hidden');
        }

        function confirmNickname() {
            const val = document.getElementById('nickname-input').value.trim();
            if (val) {
                localStorage.setItem(`nickname_${googleSub}`, val);
                initUserSession(val);
                document.getElementById('name-modal').classList.add('hidden');
            }
        }

        function initUserSession(name) {
            loginUser = name;
            document.getElementById('input-zone').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('input-header').innerHTML = `<i class="fas fa-unlock text-blue-500 mr-2"></i> 授权成功: ${name}`;
            document.getElementById('editing-date-display').innerText = `TARGET: ${editingDate}`;
            loadCheckInData();
        }

        function checkConflict() {
            const conflict = cloudData[loginUser] && cloudData[loginUser][editingDate];
            if (conflict) conflictBanner.classList.add('active');
            else conflictBanner.classList.remove('active');
        }

        taskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = taskInput.value.trim();
                if (val) {
                    currentTasks.push({ text: val, status: 0 });
                    taskInput.value = '';
                    renderChips();
                }
            }
        });

        function renderChips() {
            document.getElementById('task-preview-area').innerHTML = currentTasks.map((t, i) => `
                <div class="task-chip">
                    <span onclick="toggleStatus(${i})" class="cursor-pointer">${t.status === 1 ? '✓' : (t.status === 2 ? '×' : '○')}</span>
                    <span>${t.text}</span>
                    <i class="fas fa-times opacity-30 cursor-pointer" onclick="currentTasks.splice(${i},1);renderChips();"></i>
                </div>
            `).join('');
        }

        window.toggleStatus = (i) => { currentTasks[i].status = (currentTasks[i].status + 1) % 3; renderChips(); };

        async function doCheckIn() {
            if (!loginUser || currentTasks.length === 0) return;
            const res = await fetch('/api/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: loginUser, date: editingDate, text: JSON.stringify(currentTasks) })
            });
            if (res.ok) {
                const st = document.getElementById('success-toast');
                st.style.bottom = '40px';
                currentTasks = [];
                renderChips();
                await loadCheckInData();
                setTimeout(() => st.style.bottom = '-100px', 3000);
            }
        }

        function updateUserList() {
            const users = Object.keys(cloudData);
            userSelector.innerHTML = users.map(u => `<option value="${u}" ${u === loginUser ? 'selected' : ''}>👤 ${u}</option>`).join('');
        }

        function closeHero() { document.getElementById('hero-modal').classList.remove('active'); }
        function switchUserView() { renderCalendar(); }
    </script>
</body>

</html>
