<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 | Each Static Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // 防止主题切换闪烁
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap');

        :root {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --accent-blue: #0071e3;
        }

        .dark-mode {
            --bg-color: #000000;
            --text-color: #f5f5f7;
        }

        body {
            font-family: -apple-system, "SF Pro SC", "PingFang SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.5s ease;
            min-height: 100vh;
        }

        /* 流光文字特效 */
        .working-gradient {
            background: linear-gradient(90deg, #86868b, #1d1d1f, #86868b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        .dark-mode .working-gradient {
            background: linear-gradient(90deg, #424245, #f5f5f7, #424245);
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* 波点背景 */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--text-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.03;
            z-index: -1;
        }

        /* 博客卡片样式 */
        .blog-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark-mode .blog-card {
            background: rgba(28, 28, 30, 0.7);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            border-color: var(--accent-blue);
        }

        /* Markdown 内容高级排版美化 */
        .markdown-body {
            text-align: justify;
            line-height: 1.8;
        }

        .markdown-body h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 2rem 0 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 0.5rem;
        }

        .markdown-body h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 1.8rem 0 1.2rem;
            color: var(--accent-blue);
        }

        .markdown-body h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 1.5rem 0 1rem;
        }

        .markdown-body p {
            margin-bottom: 1.2rem;
            opacity: 0.9;
        }

        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .markdown-body ol {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .markdown-body li {
            margin-bottom: 0.4rem;
        }

        /* 苹果风格表格 */
        .markdown-body table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 2rem 0;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .markdown-body th {
            background: #fbfbfd;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            color: #86868b;
        }

        .markdown-body td {
            padding: 1rem;
            border-top: 1px solid #f5f5f7;
            font-size: 0.95rem;
        }

        .dark-mode .markdown-body th {
            background: #1c1c1e;
            color: #a1a1a6;
        }

        .dark-mode .markdown-body td {
            border-top: 1px solid #2c2c2e;
        }

        /* 引用块与代码块 */
        .markdown-body blockquote {
            border-left: 4px solid var(--accent-blue);
            padding: 0.8rem 1.5rem;
            background: rgba(0, 113, 227, 0.05);
            border-radius: 0 1rem 1rem 0;
            margin: 1.5rem 0;
            font-style: italic;
        }

        .markdown-body pre {
            border-radius: 1rem !important;
            margin: 1.5rem 0 !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .animate-reveal {
            animation: reveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="antialiased">
    <div class="grid-bg"></div>

    <script src="../components/navbar.js"></script>

    <main class="max-w-4xl mx-auto px-8 pt-32 pb-32">
        <header id="blog-header" class="text-center mb-20 space-y-6">
            <div
                class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-blue-600/10 text-blue-600 text-xs font-bold border border-blue-600/20">
                <span class="relative flex h-2 w-2">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
                </span>
                LIVE FROM GITHUB
            </div>
            <h1 class="text-5xl md:text-6xl font-black tracking-tighter working-gradient">思考同步中心</h1>
            <p class="text-gray-500 font-medium">自动同步自 GitHub /Blogs 文件夹</p>
        </header>

        <div id="blog-list" class="grid gap-6">
            <div class="text-center py-20 opacity-50 font-mono text-sm">正在建立安全连接并同步文稿...</div>
        </div>

        <div id="blog-detail" class="hidden">
            <button onclick="showList()" class="mb-10 text-blue-600 font-bold flex items-center group transition-all">
                <i class="fas fa-chevron-left mr-2 group-hover:-translate-x-1 transition-transform"></i> 返回文稿列表
            </button>
            <article id="blog-content" class="markdown-body animate-reveal"></article>
        </div>
    </main>

    <footer class="py-12 text-center opacity-40">
        <p class="text-[10px] tracking-[0.3em] uppercase font-bold">Esse quam videri · Each9084</p>
    </footer>

    <script>
        const GITHUB_USER = 'Each9084';
        const REPO_NAME = 'eachStaticWeb'; // 已修正为您的仓库名
        const BLOG_DIR = 'Blogs';

        async function fetchBlogs() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${BLOG_DIR}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const files = await response.json();

                const blogList = document.getElementById('blog-list');
                blogList.innerHTML = '';

                // 筛选 .md 文件并倒序排列 (最新的在前)
                const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();

                mdFiles.forEach(file => {
                    // 文件名解析逻辑: 2025-1225-01-标题.md
                    const nameWithoutExt = file.name.replace('.md', '');
                    const parts = nameWithoutExt.split('-');

                    const year = parts[0] || '2025';
                    const dateStr = parts[1] || '0101';
                    const index = parts[2] || '00';
                    const title = decodeURIComponent(parts.slice(3).join('-')) || '未命名文章';
                    const formattedDate = `${year}-${dateStr.substring(0, 2)}-${dateStr.substring(2, 4)}`;

                    const card = document.createElement('div');
                    card.className = 'blog-card p-8 cursor-pointer group animate-reveal';
                    card.onclick = () => loadArticle(file.download_url, title, formattedDate, index);
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-mono font-bold text-blue-500 tracking-widest uppercase">Entry ID: ${index}</span>
                            <span class="text-xs text-gray-400 font-medium">${formattedDate}</span>
                        </div>
                        <h2 class="text-2xl font-bold group-hover:text-blue-600 transition-colors">${title}</h2>
                        <p class="mt-4 text-sm text-gray-500 leading-relaxed">该文稿已就绪。点击以解析并进入深度阅读模式...</p>
                    `;
                    blogList.appendChild(card);
                });
            } catch (error) {
                document.getElementById('blog-list').innerHTML = `
                    <div class="blog-card p-10 text-center">
                        <i class="fas fa-plug-circle-exclamation text-orange-500 mb-4 text-2xl"></i>
                        <p class="text-sm font-medium">同步中断。请检查 GitHub 仓库配置或 API 配额。</p>
                    </div>`;
            }
        }

        async function loadArticle(url, title, date, index) {
            try {
                const response = await fetch(url);
                const text = await response.text();

                document.getElementById('blog-header').classList.add('hidden');
                document.getElementById('blog-list').classList.add('hidden');
                document.getElementById('blog-detail').classList.remove('hidden');

                const content = document.getElementById('blog-content');
                content.innerHTML = `
                    <div class="mb-12 border-b border-black/5 dark:border-white/5 pb-8">
                        <h1 class="font-black mb-4">${title}</h1>
                        <div class="flex items-center gap-4 text-gray-400 font-mono text-[10px] tracking-widest uppercase">
                            <span>Index: ${index}</span>
                            <span>|</span>
                            <span>Published: ${date}</span>
                            <span>|</span>
                            <span class="text-blue-500">Node: GitHub_Main</span>
                        </div>
                    </div>
                    ${marked.parse(text)}
                `;

                // 触发 Prism 代码高亮渲染
                Prism.highlightAllUnder(content);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                console.error("加载失败:", error);
            }
        }

        function showList() {
            document.getElementById('blog-header').classList.remove('hidden');
            document.getElementById('blog-list').classList.remove('hidden');
            document.getElementById('blog-detail').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        fetchBlogs();
    </script>
</body>

</html>
