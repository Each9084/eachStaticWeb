<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace | 灵感空间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Inter:wght@400;700;900&display=swap');

        :root {
            --bg-color: #ffffff;
            --text-main: #1d1d1f;
            --accent: #0071e3;
        }

        .dark-mode {
            --bg-color: #000000;
            --text-main: #f5f5f7;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background 0.5s ease;
        }

        /* 欧美风格的大标题排版 */
        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 0.9;
            letter-spacing: -0.05em;
            font-weight: 900;
        }

        .search-glass {
            background: rgba(120, 120, 128, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* 文章卡片：流体悬浮感 */
        .post-card {
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .post-card:hover {
            opacity: 0.7;
        }

        .tag-pill {
            padding: 4px 12px;
            background: rgba(0, 113, 227, 0.08);
            color: var(--accent);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="antialiased">
    <script src="../components/navbar.js"></script>

    <main class="max-w-6xl mx-auto px-8 pt-40 pb-20">
        <div class="flex flex-col md:flex-row justify-between items-end gap-8 mb-24">
            <div class="flex-1">
                <h1 class="hero-title mb-6">Blog<span class="text-blue-600">Space</span>.</h1>
                <p class="text-xl text-gray-500 font-medium">在这里，我们不仅仅是开发者，更是思想的建筑师。</p>
            </div>
            <div class="w-full md:w-80 relative search-glass p-1">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="blog-search" oninput="debounceSearch()"
                    class="w-full bg-transparent border-none py-3 pl-10 pr-4 outline-none text-sm"
                    placeholder="搜索文章标题或灵感...">
            </div>
        </div>

        <div id="tag-cloud" class="flex flex-wrap gap-3 mb-16">
            <button onclick="fetchPosts()" class="tag-pill bg-blue-600 text-white">All Posts</button>
        </div>

        <div id="post-container" class="grid grid-cols-1 gap-16">
            <div class="animate-pulse space-y-8">
                <div class="h-10 bg-gray-200 dark:bg-zinc-800 w-3/4 rounded-lg"></div>
                <div class="h-4 bg-gray-100 dark:bg-zinc-900 w-full rounded"></div>
            </div>
        </div>
    </main>

    <script>
        // 1. 初始化数据加载
        async function fetchPosts(query = '') {
            const container = document.getElementById('post-container');
            try {
                const response = await fetch(`/api/posts${query}`);
                const posts = await response.json();

                container.innerHTML = posts.map(post => `
                    <article class="post-card pb-12 cursor-pointer" onclick="viewDetail(${post.id})">
                        <div class="flex items-center gap-4 mb-4 font-mono text-[10px] text-gray-400 uppercase tracking-widest">
                            <span class="text-blue-600 font-bold">${post.nickname}</span>
                            <span>/</span>
                            <span>${new Date(post.created_at).toLocaleDateString()}</span>
                        </div>
                        <h2 class="text-4xl font-bold mb-4 hover:text-blue-600 transition">${post.title}</h2>
                        <p class="text-gray-500 text-lg mb-6 line-clamp-2">${post.summary || '这是一篇关于技术与生活的深度探讨...'}</p>
                        <div class="flex gap-2">
                            ${post.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('')}
                        </div>
                    </article>
                `).join('');
            } catch (e) {
                container.innerHTML = `<p class="opacity-50">未能连接到数据库，请检查 Vercel Postgres 配置。</p>`;
            }
        }

        // 2. 搜索防抖
        let searchTimer;
        function debounceSearch() {
            clearTimeout(searchTimer);
            const val = document.getElementById('blog-search').value;
            searchTimer = setTimeout(() => {
                fetchPosts(`?search=${val}`);
            }, 500);
        }

        // 3. 页面跳转（详情页逻辑待续）
        function viewDetail(id) {
            window.location.href = `BlogDetail.html?id=${id}`;
        }

        window.onload = () => fetchPosts();
    </script>
</body>

</html>
