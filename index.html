<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Each Static Web | Esse quam videri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // 防止深色模式闪烁
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap');

        :root {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --accent-blue: #0071e3;
            --gh-green: #39d353;
            --card-bg: rgba(255, 255, 255, 0.85);
            --calligraphy-font: "Kaiti", "STKaiti", "华文楷体", serif;
            --gold-gradient: linear-gradient(180deg, #bf953f 0%, #fcf6ba 20%, #b38728 50%, #fbf5b7 80%, #aa771c 100%);
        }

        .dark-mode {
            --bg-color: #050505;
            --text-color: #f5f5f7;
            --card-bg: rgba(20, 20, 22, 0.85);
        }

        body {
            font-family: -apple-system, "SF Pro SC", "PingFang SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.5s ease;
            overflow-x: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.45;
        }

        .gothic-title {
            font-family: 'UnifrakturMaguntia', serif;
            font-size: 1.8rem;
        }

        .calligraphy {
            font-family: var(--calligraphy-font);
        }

        .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.1));
        }

        .seal {
            display: inline-block;
            width: 30px;
            height: 30px;
            background: #d42e22;
            color: white;
            font-size: 12px;
            padding: 2px;
            border-radius: 2px;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .animate-card {
            animation: cardReveal 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .typing-container {
            font-family: 'SFMono-Regular', Consolas, monospace;
            border-right: 2px solid var(--accent-blue);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 3.5s steps(40, end) forwards, blink 0.75s step-end infinite;
        }

        @keyframes typing {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        @keyframes blink {

            from,
            to {
                border-color: transparent
            }

            50% {
                border-color: var(--accent-blue)
            }
        }

        .bento-card {
            background: var(--card-bg);
            border-radius: 2.5rem;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.5s cubic-bezier(0.15, 0.83, 0.66, 1);
        }

        .ulster-bg {
            position: absolute;
            bottom: 1rem;
            right: 2rem;
            line-height: 1;
            font-family: 'Arial Black', sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&display=swap');

        .skill-rect {
            position: absolute;
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.1) 0%, rgba(0, 0, 0, 0) 100%);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            z-index: 0;
        }

        .dark-mode .skill-rect {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="antialiased">
    <canvas id="matrix-canvas"></canvas>

    <script src="./components/navBar.js"></script>

    <header class="relative pt-32 pb-24 px-6 text-center">
        <div class="max-w-5xl mx-auto">
            <div class="mb-8">
                <h1 class="calligraphy text-7xl md:text-8xl font-bold tracking-tight mb-4">春风得意马蹄疾</h1>
                <h1 class="calligraphy text-5xl md:text-7xl font-bold opacity-80">一日看尽<span class="gold-text">長安</span>花
                    <span class="seal">Each<br>印</span>
                </h1>
            </div>
            <div class="h-8 mb-12 inline-block">
                <p class="typing-container text-[#0071e3] dark:text-blue-400 font-mono text-lg md:text-xl font-medium">
                    Welcome to the world of a national-level Rookie programmer.</p>
            </div>
            <div class="animate-card" style="animation-delay: 1s;">
                <p class="text-gray-500 dark:text-gray-400 italic text-lg md:text-x2l leading-relaxed"
                    style="font-family: 'Cormorant Garamond', serif; letter-spacing: 0.05em;">我的冲锋是堂吉诃德式的冲锋，名为生活的大风车，<br
                        class="hidden md:block">让我与你大战三百回合，三百回合!</p>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-8 pb-32">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            <div class="md:col-span-8 bento-card p-10 animate-card">
                <div class="flex items-center justify-between mb-8 text-zinc-900 dark:text-white">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-[#2ea44f] rounded-2xl flex items-center justify-center shadow-lg"><i
                                class="fab fa-github text-white text-2xl"></i></div>
                        <div>
                            <h3 class="text-xl font-bold">Open Source Contribution</h3>
                            <p class="text-xs text-gray-400 font-mono">github.com/Each9084</p>
                        </div>
                    </div>
                </div>
                <div class="flex flex-wrap gap-1.5 mb-8" id="gh-grid"></div>
                <div class="grid grid-cols-3 gap-4 border-t border-black/5 dark:border-white/5 pt-8">
                    <div class="text-center">
                        <p class="text-xs text-gray-400 uppercase font-bold">Repos</p>
                        <p class="text-2xl font-black text-[#2ea44f]" id="repo-count">--</p>
                    </div>
                    <div class="text-center border-x border-black/5 dark:border-white/5">
                        <p class="text-xs text-gray-400 uppercase font-bold">Followers</p>
                        <p class="text-2xl font-black text-[#2ea44f]" id="follower-count">--</p>
                    </div>
                    <div class="text-center">
                        <p class="text-xs text-gray-400 uppercase font-bold">Stars Earned</p>
                        <p class="text-2xl font-black text-[#2ea44f]" id="star-count">--</p>
                    </div>
                </div>
            </div>
            <div class="md:col-span-4 bento-card p-10 bg-[#1d1d1f] border-none text-white relative overflow-hidden animate-card"
                style="animation-delay: 0.2s;">
                <div class="relative z-10"><span class="text-xs font-mono text-gray-500 tracking-widest">信条</span>
                    <h3 class="text-3xl lg:text-4xl font-bold mt-6 calligraphy whitespace-nowrap">Esse quam videri</h3>
                    <p class="mt-4 text-sm text-gray-400 italic">“存真去伪，实事求是”</p>
                    <div class="mt-16 flex items-center"><span class="flex h-3 w-3 mr-3"><span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#39d353] opacity-75"></span><span
                                class="relative inline-flex rounded-full h-3 w-3 bg-[#39d353]"></span></span><span
                            class="text-sm font-bold font-mono text-[#39d353]">每日开发中...</span></div>
                </div>
                <div
                    class="ulster-bg text-white/[0.05] text-7xl font-black select-none pointer-events-none tracking-tighter uppercase">
                    TENET</div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth, height = canvas.height = window.innerHeight;
        const fontSize = 18, columns = Math.floor(width / fontSize), drops = Array(columns).fill(1);
        function drawMatrix() { ctx.fillStyle = document.body.classList.contains('dark-mode') ? 'rgba(5, 5, 5, 0.2)' : 'rgba(245, 245, 247, 0.2)'; ctx.fillRect(0, 0, width, height); ctx.font = 'bold ' + fontSize + 'px monospace'; for (let i = 0; i < drops.length; i++) { const text = Math.floor(Math.random() * 2), x = i * fontSize, y = drops[i] * fontSize; ctx.fillStyle = document.body.classList.contains('dark-mode') ? '#444' : '#999'; if (Math.random() > 0.95) ctx.fillStyle = '#0071e3'; ctx.fillText(text, x, y); if (y > height && Math.random() > 0.975) drops[i] = 0; drops[i]++; } }
        setInterval(drawMatrix, 50);
        async function fetchGitHubData(username) { try { const userRes = await fetch(`https://api.github.com/users/${username}`), userData = await userRes.json(); const repoRes = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`), repos = await repoRes.json(); const totalStars = repos.reduce((prev, curr) => prev + curr.stargazers_count, 0); document.getElementById('repo-count').innerText = userData.public_repos; document.getElementById('follower-count').innerText = userData.followers; document.getElementById('star-count').innerText = totalStars; } catch (error) { console.error("API Fetch Error", error); } }
        fetchGitHubData('Each9084');
        const ghGrid = document.getElementById('gh-grid');
        for (let i = 0; i < 210; i++) { const box = document.createElement('div'); box.style.width = '12px'; box.style.height = '12px'; box.style.borderRadius = '2px'; const level = Math.random(); box.style.backgroundColor = level > 0.8 ? '#216e39' : (level > 0.5 ? '#40c463' : '#ebedf0'); ghGrid.appendChild(box); }
        window.onresize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
    </script>
</body>

</html>
